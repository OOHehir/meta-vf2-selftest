# oe-core only, as meta-riscv, so results describe that minimal baseline.
# Do not add meta-oe/meta-poky dependencies.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# The vendor-kernel bbappend parses only with meta-riscv, so it stays optional.
BBFILES_DYNAMIC += "riscv-layer:${LAYERDIR}/dynamic-layers/riscv-layer/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "vf2-selftest"
BBFILE_PATTERN_vf2-selftest = "^${LAYERDIR}/"
BBFILE_PRIORITY_vf2-selftest = "7"

LAYERDEPENDS_vf2-selftest = "core"
LAYERRECOMMENDS_vf2-selftest = "riscv-layer"
LAYERSERIES_COMPAT_vf2-selftest = "blacksail"
