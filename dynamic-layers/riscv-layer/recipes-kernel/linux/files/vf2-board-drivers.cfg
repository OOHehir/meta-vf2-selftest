# VF2 devices riscv defconfig leaves without a driver; the same options & values as
# meta-riscv PR #650's linux-mainline-visionfive2/misc.cfg, so drop this once it lands.
# The crypto engine needs PL08X. The OpenCores PWM has a binding but no upstream
# driver, so no option here can enable it.
CONFIG_AMBA_PL08X=y
CONFIG_CRYPTO_DEV_JH7110=m
CONFIG_EEPROM_AT24=m
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=m
CONFIG_LEDS_GPIO=m
