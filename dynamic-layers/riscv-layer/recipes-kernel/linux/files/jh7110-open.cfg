# Display & GPU from the jh7110-open patches. DC & HDMI are built in, as in
# the series author's tested config.
CONFIG_DRM=y
# The DT's linux,cma pool is ignored without DMA_CMA; fbdev then fails -ENOMEM.
CONFIG_CMA=y
CONFIG_DMA_CMA=y
CONFIG_DRM_POWERVR=m
# Binds the DT's /hdmi-connector node (otherwise an unprobed device).
CONFIG_DRM_DISPLAY_CONNECTOR=y
CONFIG_DRM_VERISILICON_DC=y
CONFIG_SOC_STARFIVE_JH7110_HDMI_SUBSYSTEM=y
CONFIG_SOC_STARFIVE_JH7110_VOUT_SUBSYSTEM=y
CONFIG_DRM_STARFIVE_JH7110_INNO_HDMI=y
CONFIG_PHY_STARFIVE_JH7110_INNO_HDMI=y
CONFIG_CLK_STARFIVE_JH7110_VOUT=y
# Uncached DMA mappings on the U74 (non-coherent DMA); default y once patched.
CONFIG_ERRATA_SIFIVE=y
CONFIG_ERRATA_SIFIVE_XPBMTUC=y

# VF2 devices riscv defconfig leaves without a driver. The OpenCores PWM has a binding but
# no driver in 7.2, so no option here can enable it.
CONFIG_EEPROM_AT24=y
CONFIG_AMBA_PL08X=y
CONFIG_NEW_LEDS=y
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_GPIO=y
CONFIG_CRYPTO_DEV_JH7110=m
